<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris - Falling Block Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      display: flex;
      gap: 20px;
      padding: 20px;
      background-color: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .board-container {
      position: relative;
      border: 4px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background-color: #000;
    }

    canvas {
      display: block;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 160px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #38ef7d;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .info-box {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }

    .info-box h2 {
      font-size: 14px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 5px;
    }

    .info-box .value {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    .controls-box {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.6;
    }

    .controls-box h3 {
      color: #fff;
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ff4757;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
    }

    .overlay.hidden {
      display: none;
    }

    .restart-btn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #11998e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background-color: #38ef7d;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="board-container">
      <canvas id="tetris" width="240" height="480"></canvas>
      <div id="game-over" class="overlay hidden">
        <div>GAME OVER</div>
        <button class="restart-btn" onclick="resetGame()">Play Again</button>
      </div>
    </div>
    
    <div class="sidebar">
      <div>
        <div class="title">Tetris</div>
        <div class="info-box">
          <h2>Score</h2>
          <div id="score" class="value">0</div>
        </div>
        <div class="info-box">
          <h2>Lines</h2>
          <div id="lines" class="value">0</div>
        </div>
      </div>

      <div class="controls-box">
        <h3>Controls</h3>
        <div>← Move Left</div>
        <div>→ Move Right</div>
        <div>↑ Rotate</div>
        <div>↓ Drop Faster</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('scale');
    const scoreElement = document.getElementById('score');
    const linesElement = document.getElementById('lines');
    const gameOverScreen = document.getElementById('game-over');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 24;

    // Scale canvas context to match board size
    const ctx = canvas.getContext('2d');
    ctx.scale(BLOCK_SIZE, BLOCK_SIZE);

    // Color definitions for the 7 shapes
    const COLORS = [
      null,
      '#00f0f0', // I - Cyan
      '#0000f0', // J - Blue
      '#f0a000', // L - Orange
      '#f0f000', // O - Yellow
      '#00f000', // S - Green
      '#a000f0', // T - Purple
      '#f00000'  // Z - Red
    ];

    // Tetromino shape definitions
    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'J') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [2, 2, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'S') {
        return [
          [0, 5, 5],
          [5, 5, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 0, 0],
          [6, 6, 6],
          [0, 6, 0],
        ];
      } else if (type === 'Z') {
        return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    // Create 10x20 matrix
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    let board = createMatrix(COLS, ROWS);

    let player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
      lines: 0
    };

    let isGameOver = false;

    // Collision detection
    function collide(board, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // Merge locked piece into the board
    function merge(board, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            board[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // Rotate matrix 90 degrees
    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [
            matrix[x][y],
            matrix[y][x],
          ] = [
            matrix[y][x],
            matrix[x][y],
          ];
        }
      }

      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(board, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(board, player)) {
        player.pos.x -= dir;
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(board, player)) {
        player.pos.y--;
        merge(board, player);
        playerReset();
        boardSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (board[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(board, player)) {
        isGameOver = true;
        gameOverScreen.classList.remove('hidden');
      }
    }

    function boardSweep() {
      let rowCount = 0;
      outer: for (let y = board.length - 1; y >= 0; --y) {
        for (let x = 0; x < board[y].length; ++x) {
          if (board[y][x] === 0) {
            continue outer;
          }
        }

        const row = board.splice(y, 1)[0].fill(0);
        board.unshift(row);
        ++y;

        rowCount++;
      }

      if (rowCount > 0) {
        // Scoring system based on cleared lines
        const lineScores = [0, 100, 300, 500, 800];
        player.score += lineScores[rowCount];
        player.lines += rowCount;
      }
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();
      drawMatrix(board, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    function drawGrid() {
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 0.05;
      for (let x = 0; x < COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ROWS);
        ctx.stroke();
      }
      for (let y = 0; y < ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(COLS, y);
        ctx.stroke();
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = COLORS[value];
            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            
            // Subtle bevel feature for blocks
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(x + offset.x, y + offset.y, 1, 0.1);
            ctx.fillRect(x + offset.x, y + offset.y, 0.1, 1);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(x + offset.x, y + offset.y + 0.9, 1, 0.1);
            ctx.fillRect(x + offset.x + 0.9, y + offset.y, 0.1, 1);
          }
        });
      });
    }

    function updateScore() {
      scoreElement.innerText = player.score;
      linesElement.innerText = player.lines;
    }

    let dropCounter = 0;
    let dropInterval = 1000;

    let lastTime = 0;
    function update(time = 0) {
      if (isGameOver) return;

      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function resetGame() {
      board.forEach(row => row.fill(0));
      player.score = 0;
      player.lines = 0;
      isGameOver = false;
      gameOverScreen.classList.add('hidden');
      updateScore();
      playerReset();
      update();
    }

    document.addEventListener('keydown', event => {
      if (isGameOver) return;

      if (event.keyCode === 37) { // Left arrow
        playerMove(-1);
      } else if (event.keyCode === 39) { // Right arrow
        playerMove(1);
      } else if (event.keyCode === 40) { // Down arrow
        playerDrop();
      } else if (event.keyCode === 38) { // Up arrow
        playerRotate(1);
      }
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
